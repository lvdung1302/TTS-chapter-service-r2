[project]
name = "tts-chapter-service"
version = "2.0.0"
description = "TXT to WAV Chapter Mode - Python service"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",      # FastAPI multipart form
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",                  # BS4 parser
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
    "boto3>=1.34.0",                    # Cloudflare R2 (S3-compatible)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "services", "utils"]
